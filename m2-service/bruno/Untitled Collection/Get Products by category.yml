info:
  name: Get Products by category
  type: http
  seq: 7

http:
  method: GET
  url: http://localhost:8087/api/categories/{category}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.username
      operator: eq
      value: Doris123

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
