info:
  name: Get Customer by username
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8087/api/customers/doris123
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.username
      operator: eq
      value: doris123

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
