info:
  name: Get All Customers
  type: http
  seq: 1

http:
  method: GET
  url: https://widgetshop-backend.onrender.com/api/customers
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
