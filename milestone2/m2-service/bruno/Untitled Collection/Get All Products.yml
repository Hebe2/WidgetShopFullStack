info:
  name: Get All Products
  type: http
  seq: 4

http:
  method: GET
  url: https://widgetshop-backend.onrender.com/api/products
  body:
    type: json
    data: |-
      {
        "productId": "WD123",
        "name": "blue widget",
        "description": "widget that is blue",
        "category": "widgets",
        "listPrice": "11.99",
        "quantityInStock": "5",
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
